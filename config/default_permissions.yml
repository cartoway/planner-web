# Default permissions when a user has no Role, and seeds for a new Role in admin (before first save).
# null for planning_toolbar/spaces means "use built-in Ruby catalog" (see Preferences::Catalog).
#
# Structure when set (planning_toolbar) mirrors stored JSON after normalize_planning_toolbar:
#   planning / route / stop → segments + segment_controls
# spaces mirrors normalize_spaces (compact or full):
#   plannings / destination / … / operations → { visible, usable } (+ optional actions)
#
default: &default
  no_role: &restricted_operations_and_spaces
    planning_toolbar:
      planning:
        segments: [external_callback, optimize, zoning, vehicle_usage_set, toggle_routes, toggle_route_data, lock_routes, activate_stops, export, refresh, planning_states, duplicate, planning_dashboard]
        segment_controls:
          external_callback: { visible: true, usable: false }
          optimize: { visible: true, usable: false }
          zoning: { visible: true, usable: false }
          vehicle_usage_set: { visible: true, usable: false }
          toggle_routes: { visible: true, usable: false }
          toggle_route_data: { visible: true, usable: false }
          lock_routes: { visible: true, usable: false }
          activate_stops: { visible: true, usable: false }
          export: { visible: true, usable: false }
          refresh: { visible: true, usable: false }
          planning_states: { visible: true, usable: false }
          duplicate: { visible: true, usable: false }
          planning_dashboard: { visible: true, usable: false }
      route:
        segments: [vehicle_usage, optimize, stops, departure, view, lock, paint, external_callback, export]
        segment_controls:
          vehicle_usage: { visible: true, usable: false }
          optimize: { visible: true, usable: false }
          stops: { visible: true, usable: false }
          departure: { visible: true, usable: false }
          view: { visible: true, usable: false }
          lock: { visible: true, usable: false }
          paint: { visible: true, usable: false }
          external_callback: { visible: true, usable: false }
          export: { visible: true, usable: false }
      stop:
        segments: [active_stop, move_stop, lock_stop]
        segment_controls:
          active_stop: { visible: true, usable: false }
          move_stop: { visible: true, usable: false }
          lock_stop: { visible: true, usable: false }
    spaces:
      plannings: { visible: true, usable: false }
      destination: { visible: true, usable: false }
      vehicle_usages: { visible: true, usable: false }
      stores: { visible: true, usable: false }
      tags: { visible: true, usable: false }
      customer: { visible: true, usable: false }
      deliverable_units: { visible: true, usable: false }
      custom_attributes: { visible: true, usable: false }
      operations: { visible: true, usable: false }
  new_role:
    <<: *restricted_operations_and_spaces

development:
  <<: *default

