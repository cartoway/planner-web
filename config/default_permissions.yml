  no_role:
    planning_toolbar:
      planning:
        segments: [external_callback, optimize, zoning, vehicle_usage_set, toggle_routes, toggle_route_data, lock_routes, activate_stops, export, refresh, planning_states, duplicate, planning_dashboard]
        segment_controls:
          external_callback: { visible: true, usable: true }
          optimize: { visible: true, usable: true }
          zoning: { visible: true, usable: true }
          vehicle_usage_set: { visible: true, usable: true }
          toggle_routes: { visible: true, usable: true }
          toggle_route_data: { visible: true, usable: true }
          lock_routes: { visible: true, usable: true }
          activate_stops: { visible: false, usable: false }
          export: { visible: true, usable: true }
          refresh: { visible: true, usable: true }
          planning_states: { visible: true, usable: true }
          duplicate: { visible: true, usable: true }
          planning_dashboard: { visible: true, usable: true }
      route:
        segments: [vehicle_usage, optimize, stops, departure, view, lock, paint, external_callback, export]
