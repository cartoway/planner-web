# Reseller system role: stable Role#ref and optional explicit permissions (YAML → normalize_*).
#
# default_role.planning_toolbar / default_role.spaces — optional YAML override.
#   null or omit → built-in normalize_*({}) fallbacks.
#
default: &default
  default_role:
    ref: default
    icon: fa-hammer
    planning_toolbar:
      planning:
        segments: [external_callback, optimize, zoning, vehicle_usage_set, toggle_routes, toggle_route_data, lock_routes, activate_stops, export, refresh, planning_states, duplicate, planning_dashboard]
        segment_controls:
          external_callback: { visible: true, usable: true }
          optimize: { visible: true, usable: true }
          zoning: { visible: true, usable: true }
          vehicle_usage_set: { visible: true, usable: true }
          toggle_routes: { visible: true, usable: true }
          toggle_route_data: { visible: true, usable: true }
          lock_routes: { visible: true, usable: true }
          activate_stops: { visible: true, usable: true }
          export: { visible: true, usable: true }
          refresh: { visible: true, usable: true }
          planning_states: { visible: true, usable: true }
          duplicate: { visible: true, usable: true }
          planning_dashboard: { visible: true, usable: true }
      route:
        segments: [vehicle_usage, optimize, stops, departure, view, lock, paint, external_callback, export]
        segment_controls:
          vehicle_usage: { visible: true, usable: true }
          optimize: { visible: true, usable: true }
          stops: { visible: true, usable: true }
          departure: { visible: true, usable: true }
          view: { visible: true, usable: true }
          lock: { visible: true, usable: true }
          paint: { visible: true, usable: true }
          external_callback: { visible: true, usable: true }
          export: { visible: true, usable: true }
      stop:
        segments: [active_stop, move_stop, lock_stop]
        segment_controls:
          active_stop: { visible: true, usable: true }
          move_stop: { visible: true, usable: true }
          lock_stop: { visible: true, usable: true }
    spaces:
      plannings: { visible: true, usable: true }
      destination: { visible: true, usable: true }
      vehicle_usages: { visible: true, usable: true }
      stores: { visible: true, usable: true }
      tags: { visible: true, usable: true }
      customer: { visible: true, usable: true }
      deliverable_units: { visible: true, usable: true }
      custom_attributes: { visible: true, usable: true }
      operations: { visible: true, usable: true }

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
