name: "Ruby on Rails CI"

on:
  push:
    branches: [master, dev, dev2]
    tags:
      - 'v*'
  pull_request:
    branches: [master, dev, dev2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test_backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.5
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
      # Backend partition does not assert on packs — skip yarn/webpack (~20–40s).
      SKIP_WEBPACK: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libz-dev libicu-dev build-essential g++ libgeos-dev libgeos++-dev
          version: 1.0
      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundle-${{ hashFiles('.ruby-version', '**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-
      - name: Install Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - name: Bundle install
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local deployment true
          bundle install --jobs 4 --retry 3
      - name: Rebuild rgeo gem
        run: bundle pristine rgeo
      - name: Set up database schema
        run: bin/rails db:setup
      - name: Run backend tests
        run: bin/rake test:backend
      - name: Upload SimpleCov backend resultset
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend/
          retention-days: 1

  test_frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.5
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libz-dev libicu-dev build-essential g++ libgeos-dev libgeos++-dev
          version: 1.0
      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundle-${{ hashFiles('.ruby-version', '**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-
      - name: Install Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - name: Bundle install
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local deployment true
          bundle install --jobs 4 --retry 3
      - name: Rebuild rgeo gem
        run: bundle pristine rgeo
      - name: Set Node.js 14.x
        uses: actions/setup-node@v4
        with:
          node-version: 14.x
          cache: yarn
      - name: Install project dependencies
        run: yarn
      - name: Webpack compilation
        run: NODE_ENV=test bin/rails webpacker:compile
      - name: Set up database schema
        run: bin/rails db:setup
      - name: Run frontend minitests
        run: bin/rake test:frontend
      - name: Upload SimpleCov frontend resultset
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/frontend/
          retention-days: 1
      - name: Set Node.js 20.x (JS self-checks)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Run frontend JS self-checks
        run: bash script/run_frontend_js_checks.sh

  coverage:
    runs-on: ubuntu-latest
    needs: [test_backend, test_frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundle-${{ hashFiles('.ruby-version', '**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-
      - name: Install Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - name: Bundle install
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local deployment true
          bundle install --jobs 4 --retry 3
      - name: Download SimpleCov backend resultset
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend
      - name: Download SimpleCov frontend resultset
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/frontend
      - name: Collate SimpleCov and enforce 84% minimum
        # Avoid full Rails boot (no DB needed) — only SimpleCov gem.
        run: bundle exec ruby -Itest -e 'require "./test/simplecov_setup"; SimplecovSetup.collate!'

  lookbook_visual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test_backend, test_frontend, lint]
    services:
      postgres:
        image: postgis/postgis:15-3.5
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libz-dev libicu-dev build-essential g++ libgeos-dev libgeos++-dev
          version: 1.0
      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundle-${{ hashFiles('.ruby-version', '**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-
      - name: Install Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - name: Bundle install
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local deployment true
          bundle install --jobs 4 --retry 3
      - name: Rebuild rgeo gem
        run: bundle pristine rgeo
      - name: Set Node.js 14.x (Webpacker)
        uses: actions/setup-node@v4
        with:
          node-version: 14.x
          cache: yarn
      - name: Install project dependencies (Yarn)
        run: yarn
      - name: Webpack compilation
        run: NODE_ENV=test bin/rails webpacker:compile
      - name: Set up database schema
        run: bin/rails db:setup
      - name: Set Node.js 20.x (Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: visual-regression/package-lock.json
      - name: Install Playwright project
        working-directory: visual-regression
        run: npm ci
      - name: Install Playwright Chromium + OS deps
        working-directory: visual-regression
        run: npx playwright install --with-deps chromium
      - name: Run Lookbook visual regression tests
        working-directory: visual-regression
        run: npx playwright test
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lookbook-playwright-report
          path: visual-regression/playwright-report/
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundle-${{ hashFiles('.ruby-version', '**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-
      - name: Install Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - name: Bundle install
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local deployment true
          bundle install --jobs 4 --retry 3
      - name: Lint Ruby files
        run: bundle exec rubocop --parallel

  docker:
    runs-on: ubuntu-latest
    needs: [test_backend, test_frontend, lint, lookbook_visual, coverage]
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev2'

    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Docker Build and Push
        uses: cartoway/docker-compose-build-push-action@main
        with:
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          project: cartoway/planner-web
          service: web

  docker-superset:
    runs-on: ubuntu-latest
    needs: [test_backend, test_frontend, lint, lookbook_visual, coverage]
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev2'

    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Docker Build and Push
        uses: cartoway/docker-compose-build-push-action@main
        with:
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          project: cartoway/planner-web-superset
          compose_file: |
            docker-compose.yml
            docker-compose-superset.yml
          service: superset

  docker-superset_nginx:
    runs-on: ubuntu-latest
    needs: [test_backend, test_frontend, lint, lookbook_visual, coverage]
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev2'

    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Docker Build and Push
        uses: cartoway/docker-compose-build-push-action@main
        with:
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          project: cartoway/planner-web-superset_nginx
          compose_file: |
            docker-compose.yml
            docker-compose-superset.yml
          service: superset_nginx
