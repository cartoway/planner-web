name: "Ruby on Rails CI"

on:
  push:
    branches: [master, dev, dev2]
    tags:
      - 'v*'
  pull_request:
    branches: [master, dev, dev2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.5
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libz-dev libicu-dev build-essential g++ libgeos-dev libgeos++-dev
          version: 1.0
      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundle-${{ hashFiles('.ruby-version', '**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-
      - name: Install Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - name: Bundle install
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local deployment true
          bundle install --jobs 4 --retry 3
      - name: Rebuild rgeo gem
        run: bundle pristine rgeo
      - name: Set Node.js 14.x
        uses: actions/setup-node@v4
        with:
          node-version: 14.x
          cache: yarn
      - name: Install project dependencies
        run: yarn
      - name: Webpack compilation
        run: NODE_ENV=test bin/rails webpacker:compile
      - name: Set up database schema
        run: bin/rails db:setup
      - name: Run tests
        run: bin/rake test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundle-${{ hashFiles('.ruby-version', '**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundle-
      - name: Install Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - name: Bundle install
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local deployment true
          bundle install --jobs 4 --retry 3
      - name: Lint Ruby files
        run: bundle exec rubocop --parallel

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev2'

    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Docker Build and Push
        uses: cartoway/docker-compose-build-push-action@main
        with:
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          service: web

  docker-superset:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev2'

    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Superset image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cartoway/planner-web-superset
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push Superset image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/superset
          file: ./docker/superset/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
