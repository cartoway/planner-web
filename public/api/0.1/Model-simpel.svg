<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1020" width="1500" height="1020" role="img" aria-labelledby="title desc">
  <title id="title">Simplified domain model</title>
  <desc id="desc">REST API 0.1 core classes and associations. Hand-maintained SVG (replaces the former Eclipse Sirius / Batik export). Served from public/api/0.1/Model-simpel.svg; doc/model-uml/Model-simpel.svg is a symlink to that file.</desc>
  <style>
    .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.2; }
    .head { fill: #f3f3f3; stroke: #1a1a1a; stroke-width: 1.2; }
    .title { font: 700 13px "DejaVu Sans", "Liberation Sans", sans-serif; fill: #111; }
    .attr { font: 11px "DejaVu Sans", "Liberation Sans", sans-serif; fill: #222; }
    .note { font: italic 10px "DejaVu Sans", "Liberation Sans", sans-serif; fill: #555; }
    .mult { font: 10px "DejaVu Sans", "Liberation Sans", sans-serif; fill: #444; }
    .rel { stroke: #555; fill: none; stroke-width: 1.1; }
  </style>
  <rect width="1500" height="1020" fill="#fafafa"/>

  <!--
    Columns: Destination 20 | Tag 300 | Planning 530 | Zoning 820 | Store/Vehicle 1040 | Usage 1270
    Rows: User 16 | Customer 120 | resources 290 | usage 520 | visit/route 520 | stop 760
  -->

  <!-- User *  to  1 Customer -->
  <path class="rel" d="M640 96 V120"/>
  <text class="mult" x="648" y="110">*</text>

  <!-- Customer  to  Destination (left gutter) -->
  <path class="rel" d="M470 206 H150 V290"/>
  <text class="mult" x="160" y="248">destinations *</text>

  <!-- Customer  to  Tag -->
  <path class="rel" d="M470 206 H400 V290"/>
  <text class="mult" x="408" y="250">tags *</text>

  <!-- Customer  to  Planning -->
  <path class="rel" d="M640 206 V290"/>
  <text class="mult" x="648" y="250">plannings *</text>

  <!-- Customer  to  Store -->
  <path class="rel" d="M810 175 H1040"/>
  <text class="mult" x="860" y="169">stores *</text>

  <!-- Customer  to  DeliverableUnit (gutter between User and Store) -->
  <path class="rel" d="M810 120 V110 H1375 V96"/>
  <text class="mult" x="980" y="106">deliverable_units *</text>

  <!-- Customer  to  VehicleUsageSet (gutter below Store) -->
  <path class="rel" d="M810 206 V226 H1375 V290"/>
  <text class="mult" x="980" y="248">vehicle_usage_sets *</text>

  <!-- Destination  to  Visit -->
  <path class="rel" d="M150 470 V520"/>
  <text class="mult" x="158" y="500">visits *</text>

  <!-- Destination  to  Tag -->
  <path class="rel" d="M280 360 H300"/>
  <text class="mult" x="282" y="354">*</text>

  <!-- Visit  to  Tag (under Tag, left of Planning) -->
  <path class="rel" d="M280 580 H400 V402"/>
  <text class="mult" x="288" y="500">*</text>

  <!-- Planning  to  Tag -->
  <path class="rel" d="M500 350 H530"/>
  <text class="mult" x="504" y="344">*</text>

  <!-- Planning  to  Route -->
  <path class="rel" d="M640 400 V520"/>
  <text class="mult" x="648" y="460">routes *</text>

  <!-- Planning  to  Zoning -->
  <path class="rel" d="M790 340 H820"/>
  <text class="mult" x="794" y="334">zonings *</text>

  <!-- Zoning  to  Zone -->
  <path class="rel" d="M915 360 V520"/>
  <text class="mult" x="923" y="440">zones *</text>

  <!-- Visit  to  Stop -->
  <path class="rel" d="M150 652 V760"/>
  <text class="mult" x="158" y="710">stops *</text>

  <!-- Route  to  Stop (below Visit/Route row) -->
  <path class="rel" d="M640 652 V720 H150 V760"/>
  <text class="mult" x="300" y="714">stops *</text>

  <!-- Route  to  VehicleUsage (below Zone/Vehicle) -->
  <path class="rel" d="M790 652 V670 H1380 V622"/>
  <text class="mult" x="980" y="664">vehicle_usage 0..1</text>

  <!-- Zone  to  Vehicle -->
  <path class="rel" d="M1010 560 H1040"/>
  <text class="mult" x="1014" y="554">0..1</text>

  <!-- VehicleUsageSet  to  VehicleUsage -->
  <path class="rel" d="M1375 400 V520"/>
  <text class="mult" x="1383" y="460">usages *</text>

  <!-- Vehicle  to  VehicleUsage -->
  <path class="rel" d="M1250 580 H1270"/>
  <text class="mult" x="1252" y="574">1</text>

  <!-- User -->
  <rect class="head" x="550" y="16" width="180" height="24"/>
  <rect class="box" x="550" y="40" width="180" height="56"/>
  <text class="title" x="640" y="33" text-anchor="middle">User</text>
  <text class="attr" x="562" y="58">api_key : String [1]</text>
  <text class="attr" x="562" y="74">admin : Boolean [0..1]</text>
  <text class="note" x="562" y="88">each user has an api_key</text>

  <!-- DeliverableUnit -->
  <rect class="head" x="1270" y="16" width="210" height="24"/>
  <rect class="box" x="1270" y="40" width="210" height="56"/>
  <text class="title" x="1375" y="33" text-anchor="middle">DeliverableUnit</text>
  <text class="attr" x="1282" y="58">label : String [1]</text>
  <text class="attr" x="1282" y="74">ref : String [0..1]</text>
  <text class="note" x="1282" y="88">visit qty / vehicle capacity</text>

  <!-- Customer -->
  <rect class="head" x="470" y="120" width="340" height="24"/>
  <rect class="box" x="470" y="144" width="340" height="62"/>
  <text class="title" x="640" y="137" text-anchor="middle">Customer</text>
  <text class="attr" x="482" y="162">name : String [1]    ref : String [0..1]</text>
  <text class="attr" x="482" y="178">end_subscription : Date [0..1]</text>
  <text class="attr" x="482" y="194">max_vehicles : Integer [1]</text>

  <!-- Store -->
  <rect class="head" x="1040" y="120" width="210" height="24"/>
  <rect class="box" x="1040" y="144" width="210" height="78"/>
  <text class="title" x="1145" y="137" text-anchor="middle">Store</text>
  <text class="attr" x="1052" y="162">ref : String [0..1]</text>
  <text class="attr" x="1052" y="178">name : String [1]</text>
  <text class="attr" x="1052" y="194">lat / lng : Float [0..1]</text>
  <text class="note" x="1052" y="210">depot start / stop / reload</text>

  <!-- Destination -->
  <rect class="head" x="20" y="290" width="260" height="24"/>
  <rect class="box" x="20" y="314" width="260" height="156"/>
  <text class="title" x="150" y="307" text-anchor="middle">Destination</text>
  <text class="attr" x="32" y="332">ref : String [0..1]</text>
  <text class="attr" x="32" y="348">name : String [1]</text>
  <text class="attr" x="32" y="364">street : String [0..1]</text>
  <text class="attr" x="32" y="380">postalcode / city / country</text>
  <text class="attr" x="32" y="396">lat / lng : Float [0..1]</text>
  <text class="attr" x="32" y="412">geocoding_accuracy : Float</text>
  <text class="attr" x="32" y="428">phone_number : String [0..1]</text>
  <text class="note" x="32" y="448">geocoded if lat/lng omitted</text>
  <text class="note" x="32" y="462">ref is the import upsert key</text>

  <!-- Tag -->
  <rect class="head" x="300" y="290" width="200" height="24"/>
  <rect class="box" x="300" y="314" width="200" height="88"/>
  <text class="title" x="400" y="307" text-anchor="middle">Tag</text>
  <text class="attr" x="312" y="332">label : String [1]</text>
  <text class="attr" x="312" y="348">ref : String [0..1]</text>
  <text class="attr" x="312" y="364">color / icon : String [0..1]</text>
  <text class="note" x="312" y="388">filters visits on a planning</text>

  <!-- Planning -->
  <rect class="head" x="530" y="290" width="260" height="24"/>
  <rect class="box" x="530" y="314" width="260" height="86"/>
  <text class="title" x="660" y="307" text-anchor="middle">Planning</text>
  <text class="attr" x="542" y="332">name : String [1]</text>
  <text class="attr" x="542" y="348">ref : String [0..1]</text>
  <text class="attr" x="542" y="364">date : Date [0..1]</text>
  <text class="attr" x="542" y="384">active / outdated : Boolean</text>

  <!-- Zoning -->
  <rect class="head" x="820" y="290" width="190" height="24"/>
  <rect class="box" x="820" y="314" width="190" height="46"/>
  <text class="title" x="915" y="307" text-anchor="middle">Zoning</text>
  <text class="attr" x="832" y="332">name : String [1]</text>
  <text class="note" x="832" y="350">apply_zonings assigns stops</text>

  <!-- VehicleUsageSet -->
  <rect class="head" x="1270" y="290" width="210" height="24"/>
  <rect class="box" x="1270" y="314" width="210" height="86"/>
  <text class="title" x="1375" y="307" text-anchor="middle">VehicleUsageSet</text>
  <text class="attr" x="1282" y="332">name : String [1]</text>
  <text class="attr" x="1282" y="348">time_window_start : Time</text>
  <text class="attr" x="1282" y="364">time_window_end : Time</text>
  <text class="note" x="1282" y="388">defaults for VehicleUsage</text>

  <!-- Visit -->
  <rect class="head" x="20" y="520" width="260" height="24"/>
  <rect class="box" x="20" y="544" width="260" height="108"/>
  <text class="title" x="150" y="537" text-anchor="middle">Visit</text>
  <text class="attr" x="32" y="562">ref : String [0..1]</text>
  <text class="attr" x="32" y="578">duration : Time [0..1]</text>
  <text class="attr" x="32" y="594">time_window_start_1 / end_1</text>
  <text class="attr" x="32" y="610">quantities[*] pickup/delivery</text>
  <text class="attr" x="32" y="626">force_position : String</text>
  <text class="note" x="32" y="642">neutral | always_first | never_first | always_final</text>

  <!-- Route -->
  <rect class="head" x="530" y="520" width="260" height="24"/>
  <rect class="box" x="530" y="544" width="260" height="108"/>
  <text class="title" x="660" y="537" text-anchor="middle">Route</text>
  <text class="attr" x="542" y="562">ref : String [0..1]</text>
  <text class="attr" x="542" y="578">distance : Float [0..1]</text>
  <text class="attr" x="542" y="594">hidden / locked : Boolean</text>
  <text class="attr" x="542" y="610">outdated : Boolean [0..1]</text>
  <text class="note" x="542" y="634">vehicle_usage_id null = unassigned</text>
  <text class="note" x="542" y="646">created with the planning</text>

  <!-- Zone -->
  <rect class="head" x="820" y="520" width="190" height="24"/>
  <rect class="box" x="820" y="544" width="190" height="62"/>
  <text class="title" x="915" y="537" text-anchor="middle">Zone</text>
  <text class="attr" x="832" y="562">polygon : GeoJSON [1]</text>
  <text class="attr" x="832" y="578">vehicle_id : Integer [0..1]</text>
  <text class="note" x="832" y="594">linked to a Vehicle</text>

  <!-- Vehicle -->
  <rect class="head" x="1040" y="520" width="210" height="24"/>
  <rect class="box" x="1040" y="544" width="210" height="78"/>
  <text class="title" x="1145" y="537" text-anchor="middle">Vehicle</text>
  <text class="attr" x="1052" y="562">ref / name : String</text>
  <text class="attr" x="1052" y="578">capacities[*] per unit</text>
  <text class="attr" x="1052" y="594">color / emission</text>
  <text class="note" x="1052" y="610">physical vehicle</text>

  <!-- VehicleUsage -->
  <rect class="head" x="1270" y="520" width="210" height="24"/>
  <rect class="box" x="1270" y="544" width="210" height="78"/>
  <text class="title" x="1375" y="537" text-anchor="middle">VehicleUsage</text>
  <text class="attr" x="1282" y="562">time_window_start / end</text>
  <text class="attr" x="1282" y="578">store_start / store_stop</text>
  <text class="attr" x="1282" y="594">active : Boolean [1]</text>
  <text class="note" x="1282" y="610">one vehicle in one set</text>

  <!-- Stop -->
  <rect class="head" x="20" y="760" width="260" height="24"/>
  <rect class="box" x="20" y="784" width="260" height="94"/>
  <text class="title" x="150" y="777" text-anchor="middle">Stop</text>
  <text class="attr" x="32" y="802">stop_type : visit | reload | rest</text>
  <text class="attr" x="32" y="818">index : Integer [0..1]</text>
  <text class="attr" x="32" y="834">active / locked : Boolean</text>
  <text class="attr" x="32" y="850">time : DateTime [0..1]</text>
  <text class="note" x="32" y="868">no create-stop endpoint</text>

  <text class="note" x="300" y="790">Creating a Planning materializes one unassigned Route plus one Route per VehicleUsage,</text>
  <text class="note" x="300" y="806">and one Stop per matching Visit (filtered by tag_ids / tag_operation when set).</text>
  <text class="note" x="300" y="830">Visit.quantities and Vehicle.capacities both refer to DeliverableUnit ids.</text>
  <text class="note" x="300" y="846">VehicleUsageSet defaults (times, stores, rest) are inherited by VehicleUsage when unset.</text>
  <text class="note" x="300" y="870">Deprecated names not shown: open/close (use time_window_*), quantity (use pickup/delivery), out_of_date (use outdated), capacity (use capacities).</text>
</svg>
