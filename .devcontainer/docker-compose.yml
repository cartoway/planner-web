x-web: &web
  build:
    context: ..
    dockerfile: .devcontainer/Dockerfile
  image: ghcr.io/cartoway/planner-web:${CARTOWAY_VERSION:-dev}
  environment:
    RAILS_ENV: ${RAILS_ENV:-production}
    NODE_ENV: ${NODE_ENV:-production}
    GEOCODER_URL: ${GEOCODER_URL:-http://localhost:8081/0.1}
    GEOCODER_API_KEY: ${GEOCODER_API_KEY:-demo}
    ROUTER_URL: ${ROUTER_URL:-http://localhost:8082/0.1}
    ROUTER_API_KEY: ${ROUTER_API_KEY:-demo}
    OPTIMIZER_URL: ${OPTIMIZER_URL:-http://localhost:8083/0.1}
    OPTIMIZER_API_KEY: ${OPTIMIZER_API_KEY:-demo}
    SENTRY_DSN: ${SENTRY_DSN}
    HERE_MAP_APIKEY: ${HERE_MAP_APIKEY}
    LOG_FORMAT: ${LOG_FORMAT}
    URL_SHORTENER: ${URL_SHORTENER:-http://url_shortener:8635}
    AVAILABLE_SOLVERS: ${AVAILABLE_SOLVERS:-}
    SOPAC_RABBITMQ_HOST: ${SOPAC_RABBITMQ_HOST:-rabbitmq-lb.bluconsole.com}
    SOPAC_RABBITMQ_VHOST: ${SOPAC_RABBITMQ_VHOST:-blu-vhost}
    SOPAC_BROKER_ORG_PREFIX: ${SOPAC_BROKER_ORG_PREFIX:-/SOPAC}
    POSTGRES_USER: ${POSTGRES_USER:-planner}
    POSTGRES_DB: ${POSTGRES_DB:-planner}
    POSTGRES_DB_TEST: ${POSTGRES_DB_TEST:-planner-test}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner}
    LOOKBOOK_VRT: ${LOOKBOOK_VRT:-0}
    AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
    AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
    AZURE_TENANT_ID: ${AZURE_TENANT_ID}
  volumes:
    - ../config/database.yml.docker:/srv/app/config/database.yml
    - ../.devcontainer/production.rb:/srv/app/config/environments/production.rb
    - ../docker/uploads:/srv/app/public/uploads
    - ../public/lookbook-visual-regression:/srv/app/public/lookbook-visual-regression
    - ../visual-regression:/srv/app/visual-regression
    # Host snapshots + Playwright test-results + report PNGs (live sync for Accept baseline in Lookbook).
    - ../script/export_lookbook_visual_regression_report.rb:/srv/app/script/export_lookbook_visual_regression_report.rb:ro
    - ../app/services/lookbook/visual_regression:/srv/app/app/services/lookbook/visual_regression:ro
    - ../app/javascript/controllers/confirm_click_controller.js:/srv/app/app/javascript/controllers/confirm_click_controller.js:ro
    - ../app/javascript/controllers/lookbook_visual_regression_controller.js:/srv/app/app/javascript/controllers/lookbook_visual_regression_controller.js:ro
    # Lookbook preview classes live under test/components/previews (excluded from dev image via .dockerignore).
    - ../test/components/previews:/srv/app/test/components/previews:ro
  depends_on:
    db:
      condition: service_healthy
    redis-cache:
      condition: service_started
  restart: unless-stopped

services:
  db:
    # Place a dump file in the docker/dumps directory to load the database from it if no database is found
    # Devcontainer might display that the container is not running, but the database might be loading the dump
    # Or the web container might be running the migrations. Wait until the database is ready.
    image: postgis/postgis:15-3.5

    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=${POSTGRES_USER:-planner}
      - POSTGRES_DB=${POSTGRES_DB:-planner}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-planner}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../docker/dumps:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner} -d ${POSTGRES_DB:-planner} && psql -U ${POSTGRES_USER:-planner} -d ${POSTGRES_DB:-planner} -c '\\dt' | grep -q public"]
      start_interval: 5s
      start_period: 60s
      interval: 60s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - public-network

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save ""
    networks:
      - public-network

  web:
    <<: *web
    command: bash -c "LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2 bundle exec rake db:prepare && bash /srv/app/.devcontainer/start-web.sh"
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - public-network

  lookbook-vrt:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    depends_on:
      web:
        condition: service_started
    volumes:
      - ..:/srv/app
    networks:
      - public-network
    environment:
      LOOKBOOK_VRT: ${LOOKBOOK_VRT:-0}
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      PLAYWRIGHT_BASE_URL: http://web:3001
      PLAYWRIGHT_HTML_OPEN: never
    entrypoint: ["/bin/bash", "/srv/app/.devcontainer/run-lookbook-vrt-on-start.sh"]
    restart: "no"

  lookbook-vrt-export:
    <<: *web
    entrypoint: []
    command: ["bash", "/srv/app/.devcontainer/run-lookbook-vrt-export-on-start.sh"]
    volumes:
      - ../config/database.yml.docker:/srv/app/config/database.yml
      - ../.devcontainer/production.rb:/srv/app/config/environments/production.rb
      - ../docker/uploads:/srv/app/public/uploads
      - ../public/lookbook-visual-regression:/srv/app/public/lookbook-visual-regression
      - ../visual-regression:/srv/app/visual-regression
    # Host snapshots + Playwright test-results + report PNGs (live sync for Accept baseline in Lookbook).
      - ../script/export_lookbook_visual_regression_report.rb:/srv/app/script/export_lookbook_visual_regression_report.rb:ro
      - ../app/services/lookbook/visual_regression:/srv/app/app/services/lookbook/visual_regression:ro
      - ../.devcontainer/run-lookbook-vrt-export-on-start.sh:/srv/app/.devcontainer/run-lookbook-vrt-export-on-start.sh:ro
    depends_on:
      lookbook-vrt:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - public-network

  delayed-job:
    <<: *web
    command: bash -c "bundle exec rails runner 'Delayed::Job.delete_all' && LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2 bundle exec './bin/delayed_job run'"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      web:
        condition: service_started
    deploy:
      replicas: ${DELAYED_JOB_REPLICAS:-1}
    networks:
      - public-network

  sopac-consumer:
    <<: *web
    command: bash -c "LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2 bundle exec rake sopac:broker:run"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      web:
        condition: service_started
    deploy:
      replicas: ${SOPAC_CONSUMER_REPLICAS:-1}
    networks:
      - public-network

volumes:
  pg_data:

networks:
  public-network:
    name: public-network
    attachable: true
